alerts:
  - name: ChatLatencyP95High
    severity: critical
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    user_impact: Người dùng chờ hơn 3 giây mới nhận được câu trả lời; request chậm bị tính vào error budget.
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602437
    runbook: docs/alerts.md#alert-1
  - name: ChatErrorRateHigh
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2 or tool_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    user_impact: Người dùng nhận HTTP 500 hoặc câu trả lời thiếu context vì bước retrieval thất bại.
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602437
    runbook: docs/alerts.md#alert-2
  - name: ChatCostPerRequestSpike
    severity: warning
    condition: 'avg(response_sent.cost_usd) > 0.004 or sum(response_sent.cost_usd) over 24h > 2.5'
    duration: 10m
    type: symptom-based
    slo: guardrails.daily_cost_usd_max
    user_impact: Câu trả lời dài bất thường và chi phí vận hành tăng gấp đôi baseline (~0.002 USD/request), có thể vượt ngân sách ngày.
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602437
    runbook: docs/alerts.md#alert-3
